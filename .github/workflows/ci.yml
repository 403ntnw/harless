name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm:
    name: build and test (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build
      - name: evaluation gate (an unproven pass is a fail)
        run: gradle :harless-app:run --args="eval"

  native:
    name: native image (GraalVM)
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          native-image-job-reports: "true"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :harless-app:nativeCompile
      - name: run the native binary end to end
        run: |
          ./harless-app/build/native/nativeCompile/harless run
          ./harless-app/build/native/nativeCompile/harless eval
          ./harless-app/build/native/nativeCompile/harless rogue
      - uses: actions/upload-artifact@v4
        with:
          name: harless-linux-amd64
          path: harless-app/build/native/nativeCompile/harless
